# Dependabot is used for security updates only; Renovate owns version updates.
# `open-pull-requests-limit: 0` disables version-update PRs, while security
# PRs still honor the commit-message and assignee settings below. Titles are
# rewritten to `type(package): ...` by workflows/dependabot-update.yml.
# Options: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'build' # dependencies
      prefix-development: 'build' # devDependencies
    schedule:
      interval: 'daily'
  - package-ecosystem: 'github-actions'
    directory: '/'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'ci'
    schedule:
      interval: 'daily'
