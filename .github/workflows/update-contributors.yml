name: Update contributors

# Regenerates CONTRIBUTORS.md after each merge to main.
# Needs a repo secret CONTRIBUTORS_TOKEN: a fine-grained personal access token with
# Contents: read and write on this repo, from an account allowed to bypass branch protection.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: update-contributors

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # The secrets context isn't allowed in step conditions, so check it here once.
      TOKEN_SET: ${{ secrets.CONTRIBUTORS_TOKEN != '' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.CONTRIBUTORS_TOKEN }}

      - name: Regenerate CONTRIBUTORS.md
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.CONTRIBUTORS_TOKEN }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::notice::CONTRIBUTORS_TOKEN secret is not set; skipping."
            exit 0
          fi
          bash .github/scripts/update-contributors.sh

      - name: Commit and push if changed
        if: env.TOKEN_SET == 'true'
        run: |
          git config user.name "contributors-bot"
          git config user.email "noreply@github.com"
          git add CONTRIBUTORS.md
          if git diff --cached --quiet; then
            echo "CONTRIBUTORS.md is up to date."
            exit 0
          fi
          git commit -m "Update CONTRIBUTORS.md"
          git push origin HEAD:main
