name: Validate DEPENDABOT_TOKEN

# Manual check that the DEPENDABOT_TOKEN secret works.
# Prints the account name and repository permission only. Never prints the token.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check-token:
    runs-on: ubuntu-latest
    steps:
      - name: Check the token
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::DEPENDABOT_TOKEN is not set."
            exit 1
          fi
          login=$(gh api user --jq .login) || { echo "::error::Token was rejected by GitHub."; exit 1; }
          echo "Token belongs to: $login"
          perm=$(gh api "repos/$REPO" --jq '.permissions | if .admin then "admin" elif .maintain then "maintain" elif .push then "write" elif .triage then "triage" elif .pull then "read" else "none" end')
          echo "Repository permission: $perm"
          if [[ "$perm" != "write" && "$perm" != "maintain" && "$perm" != "admin" ]]; then
            echo "::error::Token needs at least write permission to approve and merge."
            exit 1
          fi
          echo "Token is active and has write access."
